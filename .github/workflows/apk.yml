name: Build & Publish Debug APK

on:
  push:
    tags:
      - '*' # Yeni bir etiket (tag) oluşturulduğunda çalışır

permissions:
  contents: write # Release sayfasına dosya yükleme izni

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Projenize göre '11' de yapabilirsiniz
          distribution: 'zulu'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/debug/*.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          
          
